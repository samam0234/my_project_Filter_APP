# 사용자 앱 nginx 설정
# - SPA 라우팅: try_files → index.html
# - API/헬스: Docker 네트워크의 backend:8000 으로 프록시
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;  # 응답 헤더·오류 화면에 nginx 버전을 드러내지 않는다

    # HTTPS 모드(docker-compose.https.yml)에서만 채워지는 설정 — Caddy 뒤에서 실제 접속 IP 를 쓰게 (평소엔 비어 있음)
    include /etc/nginx/snippets/*.conf;

    # 보안 헤더 — 아래 location 들은 add_header 를 따로 두지 않아 모두 이것을 물려받는다
    # CSP: 스크립트는 같은 출처만(인라인 금지). 스타일 속성(style=)·Tailwind 때문에 style 은 inline 허용.
    #      결과 이미지·GIF 는 data:/blob: URL 로도 보여 주므로 img·media 에 허용
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # 백엔드 주소를 Docker DNS 로 10초마다 다시 찾는다 — backend 컨테이너가 다시 만들어져 IP 가 바뀌어도
    # (.env 변경 · 재배포) nginx 를 재시작하지 않고 따라간다. 변수로 proxy_pass 해야 매번 다시 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # React Router 등 클라이언트 라우팅 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI /api/v1/* 프록시
    location /api/ {
        proxy_pass http://$backend_upstream;  # 요청 경로(/api/...) 그대로 전달
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 백엔드도 같은 보안 헤더를 붙인다 — 위 server 의 헤더만 남겨 중복을 없앤다
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # 업로드 여유 (백엔드 MAX_UPLOAD 약 20MB)
        client_max_body_size 25m;
        # 큰 해석 모델(12b · 27b)은 첫 호출에 모델을 메모리에 올리느라 1분 넘게 걸린다 — 기본 60초면 504.
        # 백엔드의 해석 제한(27b 180초) + 처리 시간을 넘지 않는 선까지 기다린다 (docs/API_DOCUMENTATION.md LLM 절)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 영상 · GIF — 프레임마다 처리해 수 분 걸리고(기본 60초면 504), 영상은 최대 80MB (VIDEO_MAX_UPLOAD_MB)
    location ~ ^/api/v1/(video|gif) {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 백엔드도 같은 보안 헤더를 붙인다 — 위 server 의 헤더만 남겨 중복을 없앤다
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        client_max_body_size 85m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 헬스체크 프록시
    location /health {
        proxy_pass http://$backend_upstream;
    }
}
