# =============================================================================
# 【수동·필수】 YOLO-seg 데이터셋 설정 (이 파일을 복사해 dataset_seg.yaml 로 사용)
# 사용: python training/yolo/train_segment.py --data configs/dataset_seg.yaml
#
# 조건:
#   1) path 아래 images/train|val , labels/train|val 구조
#   2) labels 는 YOLO-seg **폴리곤** 형식 (detect bbox txt 와 다름)
#   3) names 의 클래스 문자열이 앱 target / 휴리스틱 키워드와 맞을 것
#
# 해야 할 기능(학습 파이프라인):
#   - 마스크 품질 목표 데이터로 fine-tune
#   - 산출 best.pt → 저장소 루트 models/yolo26s-seg.pt 로 복사
#   - .env YOLO_MODEL_PATH 갱신 후 backend 재시작
# =============================================================================

# 【수동】 본인 데이터 루트 (training/ 기준 상대 또는 절대 경로)
path: ../datasets/my_seg   # training/datasets/my_seg 권장
train: images/train
val: images/val

# 【수동·중요】 클래스 id → 이름. 순서/이름이 바뀌면 라벨 파일 id 도 같이 재작성
# 백엔드: nodes.py keywords 의 label 과 소문자 일치 권장
names:
  0: person
  1: dog
  2: cat
  3: car
  4: bag
