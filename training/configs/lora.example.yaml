# =============================================================================
# 【수동·필수】 LoRA 학습 설정 예시 (복사해 값을 CLI 로 넘긴다)
# 사용: python training/lora/train_lora.py --base-model <로컬 HF 경로> ...
#
# 조건:
#   1) --base-model 은 HuggingFace 형식 로컬 디렉터리 (config.json + safetensors/bin)
#      Ollama GGUF (gemma4:e4b) 는 PEFT 학습에 바로 쓰지 못함
#   2) 시드(training/lora/seed/train.jsonl) + data/feedback + data/pseudo_labels 에서 레코드 생성
#   3) YOLO-seg 가중치는 이 yaml 로 학습하지 말 것 → training/yolo/
#
# 해야 할 기능:
#   - 프롬프트 분석기 도메인 어댑터 학습
#   - 산출 adapter/ → backend/models/lora/ 복사 후 LLM_PROVIDER=lora
#   - 평가: python training/lora/eval_parser.py --adapter <adapter>
# =============================================================================

# 【수동】 로컬 베이스 모델 경로 (허브 자동 다운로드 없음)
base_model: training/models/qwen2.5-1.5b-instruct

# 【수동·튜닝】 하이퍼 — train_lora.py 기본값 (instance_v2 평가 87.5% 기준)
epochs: 3
lr: 2.0e-4
batch: 4
grad_accum: 2          # 실효 배치 8
rank: 16
max_seq_len: 320
target_modules: q_proj,k_proj,v_proj,o_proj
# gradient checkpointing 기본 켬 (--no-grad-checkpoint 로 끔)

# 【수동】 데이터
seed_file: training/lora/seed/train.jsonl
seed_repeat: 2
max_pseudo: 600
feedback_dir: ../data/feedback
pseudo_dir: ../data/pseudo_labels
output: ../training/outputs/lora

# pipeline_failure 약한 정답 포함 여부 (CLI: --skip-pipeline-failure)
include_pipeline_failure: true
