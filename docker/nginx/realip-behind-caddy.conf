# HTTPS 모드(docker-compose.https.yml)에서만 nginx 에 끼워 넣는다.
# 이때 frontend(nginx) 는 밖으로 포트를 열지 않고 Caddy 만 접근하므로, Docker 대역에서 온 X-Real-IP 를 믿어도 된다.
# 그래야 backend 의 비로그인 속도 제한이 Caddy IP 하나로 묶이지 않고 사람마다 걸린다.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
