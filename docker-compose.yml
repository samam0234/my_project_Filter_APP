# 컷앤킵 Docker Compose
#   docker compose -p cut_and_keep --env-file .env up -d --build
#   docker compose -p cut_and_keep down          # 중지 (DB 데이터 유지)
#   DB 초기화(계정 변경 등): down 후 ./data/mariaDB_datas 폴더를 삭제하고 다시 up
#     (DB 가 bind mount 라 `down -v` 로는 지워지지 않는다)
#
# 네트워크/프로젝트 이름: cut_and_keep 만 사용 (구 cutnkeep 스택과 중복 금지)
#
# ---------- 접속 요약 ----------
# backend API     http://localhost:8000
# frontend        http://localhost:80
# Adminer         http://localhost:8081  (System=MySQL, Server=mariadb)
# Redis (호스트)  localhost:6380
# MariaDB (호스트/DBeaver)
#   Host=127.0.0.1  Port=${MARIADB_PORT}  User/Pass=.env 의 MARIADB_*
#   인증: 비밀번호만 (GSS-API / SSL 미사용)
#   ※ 172.18.0.x 는 브리지 게이트웨이 — DBeaver 호스트로 쓰지 말 것
#
# ---------- .env 역할 분리 ----------
# 호스트 도구: MARIADB_HOST=localhost, MARIADB_PORT=3309 등 .env 값 그대로
# backend 컨테이너: 아래 environment 가 DB/Redis/LLM 주소를 덮어씀
#   서비스 DB (users·jobs·batch) : DB_DIALECT=sqlite → ./backend/data/cutnkeep.db
#   학습 DB (feedbacks·learning_samples) : LEARNING_DB_DIALECT=mariadb, MARIADB_HOST=mariadb, MARIADB_PORT=3306
#   REDIS_URL=redis://redis:6379/0
#   LLM_BASE_URL=host.docker.internal (호스트 Ollama)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 세그 런타임: ultralytics(기본, .pt) | onnx(가볍게, .onnx — YOLO_MODEL_PATH 도 .onnx 로)
        SEG_RUNTIME: ${SEG_RUNTIME:-ultralytics}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 내부 DNS — .env 의 localhost/호스트 포트 무시
      # 서비스 DB 는 SQLite (볼륨 ./backend/data), 학습 데이터 기록은 MariaDB
      DB_DIALECT: sqlite
      LEARNING_DB_DIALECT: mariadb
      # 컨테이너에서는 MariaDB 가 healthy 일 때만 뜨므로 fallback 없이 실패를 드러낸다
      LEARNING_DB_FALLBACK_SQLITE: "false"
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: ${MARIADB_USER:-cutnkeep}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-cutnkeep}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cutnkeep}
      REDIS_URL: redis://redis:6379/0
      # 호스트 PC Ollama (Docker Desktop Windows/Mac)
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      # 서비스 런타임 (backend/): 업로드·서비스 SQLite·서빙 모델·앱 로그
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
      # 학습 공유 (루트 data/): backend 가 기록 → training·scripts 가 읽음
      - ./data/feedback:/app/data/feedback
      - ./data/pseudo_labels:/app/data/pseudo_labels
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cutnkeep_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cutnkeep_net

  mariadb:
    # 공식 이미지 — GSS 커스텀 빌드 없음. 비밀번호 + skip_ssl 만 사용
    image: mariadb:11
    ports:
      # 호스트 포트(.env MARIADB_PORT, 예 3309) → 컨테이너 3306
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      # MYSQL_* 는 볼륨 최초 생성 시에만 계정/DB 생성에 사용됨
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-cutnkeep}
      MYSQL_USER: ${MARIADB_USER:-cutnkeep}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-cutnkeep}
    volumes:
      # DB 파일을 호스트 ./data/mariaDB_datas 에 직접 저장 (탐색기에서 보임 · 백업/이전 쉬움)
      # 폴더는 처음엔 비어 있어야 하며(.gitkeep 금지) 없으면 Docker 가 만든다. git 제외.
      - ./data/mariaDB_datas:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --skip-ssl
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - cutnkeep_net

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - cutnkeep_net

  # 기본 `up` 에는 포함되지 않는다. 배치를 Redis 로 보낼 때만:
  #   BATCH_USE_CELERY=true docker compose -p cut_and_keep --profile phase2 up -d celery_worker
  celery_worker:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SEG_RUNTIME: ${SEG_RUNTIME:-ultralytics}
    command: celery -A app.tasks.batch_tasks worker --loglevel=info
    env_file:
      - .env
    environment:
      DB_DIALECT: sqlite
      REDIS_URL: redis://redis:6379/0
      BATCH_USE_CELERY: "true"
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cutnkeep_net

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cutnkeep_net

networks:
  cutnkeep_net:
    name: cut_and_keep_net
    driver: bridge
