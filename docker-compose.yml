# 컷앤킵 Docker Compose
#   docker compose -p cut_and_keep --env-file .env up -d --build
#   docker compose -p cut_and_keep down          # 중지 (DB 데이터 유지)
#   DB 초기화(계정 변경 등): down 후 ./data/mariaDB_datas 폴더를 삭제하고 다시 up
#     (DB 가 bind mount 라 `down -v` 로는 지워지지 않는다)
#
# 네트워크/프로젝트 이름: cut_and_keep 만 사용 (구 cutnkeep 스택과 중복 금지)
#
# ---------- 접속 요약 ----------
# backend API     http://localhost:8000
# frontend        http://localhost:80
# Adminer         http://localhost:8081  (System=MySQL, Server=mariadb)
# Redis (호스트)  localhost:6380
# MariaDB (호스트/DBeaver)
#   Host=127.0.0.1  Port=${MARIADB_PORT}  User/Pass=.env 의 MARIADB_*
#   인증: 비밀번호만 (GSS-API / SSL 미사용)
#   ※ 172.18.0.x 는 브리지 게이트웨이 — DBeaver 호스트로 쓰지 말 것
#
# ---------- .env 역할 분리 ----------
# 호스트 도구: MARIADB_HOST=localhost, MARIADB_PORT=3309 등 .env 값 그대로
# backend 컨테이너: 아래 environment 가 DB/Redis/LLM 주소를 덮어씀
#   서비스 DB (users·jobs·batch) : DB_DIALECT=sqlite → ./backend/data/cutnkeep.db (호스트 backend 는 cutnkeep.host.db)
#   학습 DB (feedbacks·learning_samples) : LEARNING_DB_DIALECT=mariadb, MARIADB_HOST=mariadb, MARIADB_PORT=3306
#   REDIS_URL=redis://redis:6379/0
#   LLM_BASE_URL=host.docker.internal (호스트 Ollama)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 세그 런타임: ultralytics(기본, .pt) | onnx(가볍게, .onnx — YOLO_MODEL_PATH 도 .onnx 로)
        SEG_RUNTIME: ${SEG_RUNTIME:-ultralytics}
    ports:
      # 백엔드 직접 접근은 이 PC 에서만 (사용자는 frontend :80 의 nginx 를 거친다). 다른 기기에서 열려면 BIND_HOST=0.0.0.0
      # 호스트에서 uvicorn 을 따로 띄워 8000 이 차 있으면 BACKEND_PORT=8001 처럼 바꾼다 (nginx 는 컨테이너끼리 8000 으로 연결)
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 내부 DNS — .env 의 localhost/호스트 포트 무시
      # 서비스 DB(회원 · 작업 · 배치)와 학습 DB 모두 MariaDB — 동시 접속에 강하고 백업은 mariadb-backup 서비스가 한다
      # 처음 바꾸면 옛 SQLite(data/cutnkeep.db)의 회원 · 작업을 기동 시 한 번 옮긴다 (SERVICE_DB_IMPORT_FROM)
      # SQLite 로 되돌리기: DOCKER_DB_DIALECT=sqlite
      DB_DIALECT: ${DOCKER_DB_DIALECT:-mariadb}
      # DOCKER_DB_DIALECT=sqlite 일 때만 — 호스트 backend(.env 의 SQLITE_PATH)와 다른 파일 (같은 파일을 둘이 쓰면 깨진다)
      SQLITE_PATH: ${DOCKER_SQLITE_PATH:-data/cutnkeep.db}
      # nginx(frontend 컨테이너)가 넘기는 X-Real-IP 를 믿는 대역 — 비로그인 속도 제한이 사람마다 따로 걸리게
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      LEARNING_DB_DIALECT: mariadb
      # 컨테이너에서는 MariaDB 가 healthy 일 때만 뜨므로 fallback 없이 실패를 드러낸다
      LEARNING_DB_FALLBACK_SQLITE: "false"
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: ${MARIADB_USER:-cutnkeep}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-cutnkeep}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cutnkeep}
      REDIS_URL: redis://redis:6379/0
      # 배치를 Redis 워커로 넘길지. 셸·--env-file 값을 받는다 (.env 파일만 읽던 이전 설명은 백엔드에 적용되지 않았음)
      BATCH_USE_CELERY: ${BATCH_USE_CELERY:-false}
      # 호스트 PC Ollama (Docker Desktop Windows/Mac)
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      # 서비스 런타임 (backend/): 업로드·서비스 SQLite·서빙 모델·앱 로그
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
      # 학습 공유 (루트 data/): backend 가 기록 → training·scripts 가 읽음
      - ./data/feedback:/app/data/feedback
      - ./data/pseudo_labels:/app/data/pseudo_labels
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cutnkeep_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # 개인정보 처리방침 · 이용약관에 들어갈 운영자 정보 (빌드 때 박힌다 — 바꾸면 다시 빌드)
      args:
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        VITE_OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
        VITE_POLICY_DATE: ${POLICY_DATE:-}
        # 처리방침에 적는 실패 · 확신 낮은 요청 사진 보관 일수 — 백엔드 FEEDBACK_IMAGE_RETENTION_DAYS 와 같은 값 (바꾸면 frontend 다시 빌드)
        VITE_FEEDBACK_IMAGE_DAYS: ${FEEDBACK_IMAGE_RETENTION_DAYS:-30}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cutnkeep_net

  mariadb:
    # 공식 이미지 — GSS 커스텀 빌드 없음. 비밀번호 + skip_ssl 만 사용
    image: mariadb:11
    ports:
      # 호스트 포트(.env MARIADB_PORT, 예 3309) → 컨테이너 3306
      - "${BIND_HOST:-127.0.0.1}:${MARIADB_PORT:-3306}:3306"
    environment:
      # MYSQL_* 는 볼륨 최초 생성 시에만 계정/DB 생성에 사용됨
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-cutnkeep}
      MYSQL_USER: ${MARIADB_USER:-cutnkeep}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-cutnkeep}
    volumes:
      # DB 파일을 호스트 ./data/mariaDB_datas 에 직접 저장 (탐색기에서 보임 · 백업/이전 쉬움)
      # 폴더는 처음엔 비어 있어야 하며(.gitkeep 금지) 없으면 Docker 가 만든다. git 제외.
      - ./data/mariaDB_datas:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --skip-ssl
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - cutnkeep_net

  redis:
    image: redis:7-alpine
    ports:
      - "${BIND_HOST:-127.0.0.1}:6380:6379"
    restart: unless-stopped
    networks:
      - cutnkeep_net

  # 기본 `up` 에는 포함되지 않는다. 배치를 Redis 로 보낼 때만 — backend 와 워커 둘 다 BATCH_USE_CELERY=true 여야 한다:
  #   BATCH_USE_CELERY=true docker compose -p cut_and_keep --env-file .env --profile phase2 up -d backend celery_worker
  # 워커 프로세스 수는 CELERY_CONCURRENCY (기본 1 — 프로세스마다 세그 모델을 따로 올리므로 메모리를 곱해서 쓴다)
  celery_worker:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SEG_RUNTIME: ${SEG_RUNTIME:-ultralytics}
    command: celery -A app.tasks.batch_tasks worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    env_file:
      - .env
    environment:
      DB_DIALECT: ${DOCKER_DB_DIALECT:-mariadb}
      SQLITE_PATH: ${DOCKER_SQLITE_PATH:-data/cutnkeep.db}
      LEARNING_DB_DIALECT: mariadb
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: ${MARIADB_USER:-cutnkeep}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-cutnkeep}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cutnkeep}
      REDIS_URL: redis://redis:6379/0
      BATCH_USE_CELERY: "true"
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cutnkeep_net

  adminer:
    image: adminer:4
    ports:
      - "${BIND_HOST:-127.0.0.1}:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cutnkeep_net

  # MariaDB 자동 백업 — 서비스 DB · 학습 DB 를 한 번에 덤프 (docker/mariadb/backup/backup.sh)
  # MARIADB_BACKUP_HOURS(24)마다 data/mariaDB_backups/<DB>-YYYYmmdd-HHMMSS.sql.gz, MARIADB_BACKUP_KEEP_DAYS(7)일 보관
  mariadb-backup:
    image: mariadb:11
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      MARIADB_HOST: mariadb
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cutnkeep}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      BACKUP_HOURS: ${MARIADB_BACKUP_HOURS:-24}
      BACKUP_KEEP_DAYS: ${MARIADB_BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./docker/mariadb/backup/backup.sh:/backup.sh:ro
      - ./data/mariaDB_backups:/backups
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cutnkeep_net

  # 개발용 메일 받은편지함 — 실제로 밖에 보내지 않고 http://127.0.0.1:8025 에서 본다
  # 켜기: docker compose -p cut_and_keep --env-file .env --profile mail up -d mailpit
  # .env: SMTP_HOST=mailpit · SMTP_PORT=1025 · SMTP_STARTTLS=false · SMTP_SSL=false (backend 재시작)
  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["mail"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:8025:8025"
    restart: unless-stopped
    networks:
      - cutnkeep_net

networks:
  cutnkeep_net:
    name: cut_and_keep_net
    driver: bridge
